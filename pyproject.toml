[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inferbench"
version = "0.1.0"
description = "Vulkan vs ROCm/HIP Auto-Benchmarker for Local LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xanpavle" }]

[project.scripts]
inferbench = "inferbench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["inferbench*"]